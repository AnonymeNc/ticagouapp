# Socle commun du serveur : PostgreSQL (une base par crèche), Caddy (HTTPS automatique) et, en option, le portail
# parents et la supervision. Voir docs/EXPLOITATION.md.
#   ./creche.sh socle
name: ticagou-socle
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticagou_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans socle.env}
      POSTGRES_DB: postgres
      TZ: Pacific/Noumea
    volumes:
      - db:/var/lib/postgresql/data
    networks: [ticagou]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticagou_admin -d postgres"]
      interval: 10s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TICAGOU_DONNEES}/caddy-sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [ticagou]

  # Portail parents et supervision : ./creche.sh socle --portail
  portail:
    profiles: [portail]
    build: ../parents-portal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORTAL_DB_URL: jdbc:postgresql://db:5432/portail
      PORTAL_DB_USER: portail
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:-}
      PORTAL_PUBLIC_URL: https://${PORTAL_DOMAIN:-}
      PORTAL_FILE_KEY: ${PORTAL_FILE_KEY:-}
      PORTAL_ADMIN_TOKEN: ${PORTAL_ADMIN_TOKEN:-}
      PORTAL_SUPERVISION_EMAIL: ${PORTAL_SUPERVISION_EMAIL:-}
      PORTAL_SMTP_HOST: ${PORTAL_SMTP_HOST:-}
      PORTAL_SMTP_PORT: ${PORTAL_SMTP_PORT:-587}
      PORTAL_SMTP_USER: ${PORTAL_SMTP_USER:-}
      PORTAL_SMTP_PASSWORD: ${PORTAL_SMTP_PASSWORD:-}
      PORTAL_SMTP_AUTH: "true"
      PORTAL_SMTP_STARTTLS: "true"
      PORTAL_MAIL_FROM: ${PORTAL_MAIL_FROM:-}
      PORTAL_FORWARD_HEADERS: native
    networks: [ticagou]

  # Console de l'éditeur (ADR 0017) : ./creche.sh socle --console
  # Publiée par Caddy selon CONSOLE_ACCES (internet, adresses, tunnel) ; toujours joignable par tunnel SSH sur 127.0.0.1:8095.
  console:
    profiles: [console]
    build: ../console
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8095:8095"
    environment:
      CONSOLE_DB_URL: jdbc:postgresql://db:5432/console
      CONSOLE_DB_USER: console
      CONSOLE_DB_PASSWORD: ${CONSOLE_DB_PASSWORD:-}
      CONSOLE_SECRET_KEY: ${CONSOLE_SECRET_KEY:-}
      CONSOLE_SETUP_TOKEN: ${CONSOLE_SETUP_TOKEN:-}
      # Supervision lue dans le portail (réseau interne) avec son jeton d'administration.
      CONSOLE_PORTAL_URL: http://portail:8090
      CONSOLE_PORTAL_ADMIN_TOKEN: ${PORTAL_ADMIN_TOKEN:-}
      # Rapport de l'hôte : creche.sh rapport-console (cron), sur 127.0.0.1:8095/interne/v1/hote.
      CONSOLE_HOST_TOKEN: ${CONSOLE_HOST_TOKEN:-}
      # Factures et relances : préparées dans la boîte d'envoi, envoyées au clic (ADR 0017).
      CONSOLE_MAIL_FROM: ${CONSOLE_MAIL_FROM:-}
      CONSOLE_SMTP_HOST: ${CONSOLE_SMTP_HOST:-${PORTAL_SMTP_HOST:-}}
      CONSOLE_SMTP_PORT: ${CONSOLE_SMTP_PORT:-${PORTAL_SMTP_PORT:-587}}
      CONSOLE_SMTP_USER: ${CONSOLE_SMTP_USER:-${PORTAL_SMTP_USER:-}}
      CONSOLE_SMTP_PASSWORD: ${CONSOLE_SMTP_PASSWORD:-${PORTAL_SMTP_PASSWORD:-}}
      CONSOLE_SMTP_AUTH: "true"
      CONSOLE_SMTP_STARTTLS: "true"
      CONSOLE_FORWARD_HEADERS: native
      # Exports des crèches (creche.sh exporter), téléchargés depuis la console avant une suppression.
      CONSOLE_EXPORTS_DIR: /exports
    volumes:
      - ${TICAGOU_DONNEES}/console-exports:/exports:ro
    networks: [ticagou]

volumes:
  db:
  caddy-data:
  caddy-config:

networks:
  ticagou:
    name: ticagou
