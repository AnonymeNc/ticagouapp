spring:
  application:
    name: ticagou-server
  datasource:
    url: ${TICAGOU_DB_URL:jdbc:postgresql://localhost:5435/ticagou}
    username: ${TICAGOU_DB_USER:ticagou}
    password: ${TICAGOU_DB_PASSWORD:ticagou}
    hikari:
      data-source-properties:
        # Les erreurs PostgreSQL ne recopient pas la ligne fautive (« Failing row contains … ») : pas de données
        # de santé dans les journaux du serveur.
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Pacific/Noumea
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
  web:
    # Messages de validation en français
    locale: fr_FR
    locale-resolver: fixed
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${TICAGOU_PORT:8080}
  # Derrière le proxy HTTPS : native (adresse réelle du client). Jamais sans proxy : l'en-tête serait falsifiable.
  forward-headers-strategy: ${TICAGOU_FORWARD_HEADERS:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Documentation de l'API : ouverte en développement, fermée en production (TICAGOU_API_DOCS=false).
springdoc:
  api-docs:
    enabled: ${TICAGOU_API_DOCS:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${TICAGOU_API_DOCS:true}
    path: /swagger-ui.html

ticagou:
  zone: Pacific/Noumea
  security:
    # Clé HMAC en Base64 (≥ 32 octets). Vide : générée au premier démarrage et conservée en base.
    jwt-secret: ${TICAGOU_JWT_SECRET:}
    mfa-required: ${TICAGOU_MFA_REQUIRED:false}
  # Licence (ADR 0011) : évaluation sans clé, puis grâce après l'échéance, avant la lecture seule.
  license:
    evaluation-days: ${TICAGOU_EVALUATION_DAYS:30}
    grace-days: ${TICAGOU_GRACE_DAYS:30}
  # Applications mobiles (ADR 0027) : version minimale exigée ; 0.0.0 = aucune. Relevée pour un correctif de sécurité.
  app:
    min-direction: ${TICAGOU_APP_MIN_DIRECTION:0.0.0}
    min-pointage: ${TICAGOU_APP_MIN_POINTAGE:0.0.0}
  # Jeu de démonstration (développement) : jamais activé en production.
  demo:
    enabled: ${TICAGOU_DEMO:false}
