# Mises à jour des dépendances proposées une fois par mois (demandes de fusion à relire, jamais fusionnées seules).
# Pas de version majeure côté Java (Spring Boot 4, springdoc 3…) ni pour TypeScript : ces migrations se décident et
# se font à la main.
version: 2
updates:
  - package-ecosystem: maven
    directory: /server
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /parents-portal/server
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /parents-portal/web
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
