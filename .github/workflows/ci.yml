# Intégration continue : tous les tests à chaque envoi et à chaque demande de fusion.
# Les tests d'intégration utilisent Testcontainers (Docker est disponible sur les machines Ubuntu de GitHub).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mobile:
        description: "Compiler aussi les applications mobiles (Android et iOS : minutes coûteuses, macOS compte 10 fois)"
        type: boolean
        default: true

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serveur:
    name: Serveur (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests unitaires et d'intégration
        working-directory: server
        run: bash mvnw -B verify
      - name: Rapports des tests en échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-serveur
          path: |
            server/target/surefire-reports
            server/target/failsafe-reports

  portail:
    name: Portail parents (Java + PWA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: parents-portal/web/pnpm-lock.yaml
      - name: PWA des parents
        working-directory: parents-portal/web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Service hébergé
        working-directory: parents-portal/server
        run: bash mvnw -B verify

  console:
    name: Console de l'éditeur (Java + React)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: console/web/pnpm-lock.yaml
      - name: Interface
        working-directory: console/web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Serveur
        working-directory: console/server
        run: bash mvnw -B verify
      - name: Image
        run: docker build -t ticagou-console:ci console

  web:
    name: Bureau et tablette (React)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

  image:
    name: Image de l'instance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/Dockerfile -t ticagou-web:ci .
      - name: Scripts d'exploitation (syntaxe)
        run: sh -n deploy/creche.sh && sh -n deploy/sauvegarde-hors-site.sh && sh -n deploy/secrets.sh

  # Applications mobiles (ADR 0023) : front embarqué, plugins cohérents, projets natifs compilés sans signature.
  # À la demande seulement (Actions › Tests › Run workflow, case « mobile ») : ces compilations coûtent cher en minutes.
  mobile-android:
    name: Applications mobiles (Android)
    if: github.event_name == 'workflow_dispatch' && inputs.mobile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Fronts et coques
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir parents-portal/web install --frozen-lockfile
          pnpm --dir mobile install --frozen-lockfile
          node mobile/scripts/check-versions.mjs
          node mobile/scripts/build.mjs
      - name: Compilation Android (debug)
        run: |
          for app in direction pointage parents; do
            (cd mobile/$app/android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug)
          done
      - uses: actions/upload-artifact@v7
        with:
          name: applications-android
          path: mobile/*/android/app/build/outputs/apk/debug/*.apk

  # Décision 4 du plan (14/11/2026) : builds iOS sur les machines macOS de GitHub Actions.
  mobile-ios:
    name: Applications mobiles (iOS)
    if: github.event_name == 'workflow_dispatch' && inputs.mobile
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Fronts et coques
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir parents-portal/web install --frozen-lockfile
          pnpm --dir mobile install --frozen-lockfile
          node mobile/scripts/build.mjs
      # Pointage : Android seulement (décision 5 du plan, 14/11/2026).
      - name: Compilation iOS (simulateur, sans signature)
        run: |
          for app in direction parents; do
            xcodebuild -project mobile/$app/ios/App/App.xcodeproj -scheme App -configuration Debug \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          done
