# Publication des applications mobiles (ADR 0027, docs/EXPLOITATION.md § Applications mobiles) : lancée à la main.
# Construit les versions signées depuis le commit choisi et les envoie en test interne (Google Play) et TestFlight.
# Secrets à créer par l'éditeur une fois ses comptes développeur ouverts (décision 3 du plan) :
#   Android : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   iOS     : APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_BASE64 (.p8)
# Le dépôt des AAB sur Google Play se fait à la main la première fois (création des fiches), puis depuis la console Play.
name: Publication mobile

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Numéro de build (croissant, unique par store)"
        required: true

jobs:
  android:
    name: Android (AAB signés)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Fronts et coques
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir parents-portal/web install --frozen-lockfile
          pnpm --dir mobile install --frozen-lockfile
          node mobile/scripts/build.mjs
      - name: Clé de signature
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "Secret ANDROID_KEYSTORE_BASE64 absent : voir docs/EXPLOITATION.md."; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/ticagou.jks"
      - name: AAB signés
        env:
          TICAGOU_ANDROID_KEYSTORE: ${{ runner.temp }}/ticagou.jks
          TICAGOU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TICAGOU_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TICAGOU_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TICAGOU_BUILD_NUMBER: ${{ inputs.build }}
        run: |
          for app in direction pointage parents; do
            (cd mobile/$app/android && chmod +x gradlew && ./gradlew --no-daemon bundleRelease)
          done
      - uses: actions/upload-artifact@v7
        with:
          name: applications-android-${{ inputs.build }}
          path: mobile/*/android/app/build/outputs/bundle/release/*.aab

  ios:
    name: iOS (TestFlight)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Fronts et coques
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir parents-portal/web install --frozen-lockfile
          pnpm --dir mobile install --frozen-lockfile
          node mobile/scripts/build.mjs
      - name: Archive et envoi à App Store Connect
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$KEY" || { echo "Secrets App Store Connect absents : voir docs/EXPLOITATION.md."; exit 1; }
          echo "$KEY" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
          </dict></plist>
          EOF
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/AuthKey.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          # Pointage : Android seulement (décision 5).
          for app in direction parents; do
            xcodebuild -project mobile/$app/ios/App/App.xcodeproj -scheme App -configuration Release \
              -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/$app.xcarchive" \
              DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="${{ inputs.build }}" $AUTH archive
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/$app.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/$app" $AUTH
          done
