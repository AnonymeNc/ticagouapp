spring:
  application:
    name: ticagou-console
  datasource:
    url: ${CONSOLE_DB_URL:jdbc:postgresql://localhost:5436/console}
    username: ${CONSOLE_DB_USER:console}
    password: ${CONSOLE_DB_PASSWORD:console}
    hikari:
      data-source-properties:
        logServerErrorDetail: false
  flyway:
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
  # Serveur de messagerie des factures et relances (envoi au clic seulement).
  mail:
    host: ${CONSOLE_SMTP_HOST:localhost}
    port: ${CONSOLE_SMTP_PORT:1025}
    username: ${CONSOLE_SMTP_USER:}
    password: ${CONSOLE_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${CONSOLE_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${CONSOLE_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  thymeleaf:
    # Seulement pour les PDF : l'interface est l'application React.
    check-template-location: false
  web:
    locale: fr_FR
    locale-resolver: fixed

server:
  port: ${CONSOLE_PORT:8095}
  # Derrière Caddy : adresse du client et schéma lus dans X-Forwarded-*.
  forward-headers-strategy: ${CONSOLE_FORWARD_HEADERS:native}
  servlet:
    session:
      # Inactivité ; la durée maximale (8 h) est contrôlée par SessionAgeFilter.
      timeout: 30m
      cookie:
        name: CONSOLE_SESSION
        http-only: true
        secure: ${CONSOLE_SECURE_COOKIE:true}
        same-site: strict
      tracking-modes: cookie

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

console:
  # Clé de chiffrement des secrets TOTP (Base64, 32 octets) : openssl rand -base64 32
  secret-key: ${CONSOLE_SECRET_KEY:}
  # Jeton à usage unique pour créer le premier compte ; sans effet dès qu'un compte existe.
  setup-token: ${CONSOLE_SETUP_TOKEN:}
  secure-cookie: ${CONSOLE_SECURE_COOKIE:true}
  session-max-hours: 8
  # Supervision, lue dans le portail sur le réseau interne du socle (ADR 0012, 0017).
  portal-url: ${CONSOLE_PORTAL_URL:http://portail:8090}
  portal-admin-token: ${CONSOLE_PORTAL_ADMIN_TOKEN:}
  # Rapport de l'hôte (creche.sh rapport-console, cron toutes les 5 min) : POST /interne/v1/hote.
  host-token: ${CONSOLE_HOST_TOKEN:}
  scheduling: ${CONSOLE_SCHEDULING:true}
  # Factures et relances : préparées dans la boîte d'envoi, envoyées au clic (plan console § 0 bis).
  mail-from: ${CONSOLE_MAIL_FROM:}
  renewal-lead-days: 45
  monthly-lead-days: 10
  # Exports des crèches (creche.sh exporter), montés en lecture seule depuis l'hôte ; téléchargés avant une suppression.
  exports-dir: ${CONSOLE_EXPORTS_DIR:exports}
